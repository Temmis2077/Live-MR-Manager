<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
    <title>OSW Song Info Overlay</title>
    <!-- @import는 로드가 끝날 때까지 첫 페인트를 막아, 느린 네트워크에서 이
         투명 오버레이가 잠깐 흰 배경으로 보이는 원인이 된다(가끔 발생하는 흰
         배경 버그). media="print" 트릭으로 렌더링을 막지 않게 비동기 로드한다.
         color-scheme: dark only는 브라우저가 기본 스타일시트를 어둡게 적용해
         페이지 로드 직전의 흰색 깜빡임도 방지한다. -->
    <meta name="color-scheme" content="dark only">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --accent-color: #8b5cf6;
      --accent-rgb: 139 92 246;
      --overlay-scale: 1;
      --overlay-font: 'Inter', 'Noto Sans KR', sans-serif;
      --overlay-rounding: 20px;
      --glass-bg: rgba(15, 15, 20, 0.85);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --thumb-fallback: #222;
      /* 등장 애니메이션 이동 거리 — 뷰포트(=OBS 소스 크기) 비례라, 소스를
         어떤 크기로 잡아도(비율만 비슷하면) 같은 느낌으로 슬라이드된다. */
      --enter-gap-x: 10vw;
      --enter-gap-y: 20vh;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
          background: transparent !important;
          color-scheme: dark;
        }

    /* 본체가 OBS 브라우저 소스에 설정된 크기를 그대로 채운다 — 예전엔 body가
       1200×300 고정이라, 소스를 그보다 크게 잡으면 카드 주위에 빈 여백이
       한참 남고, 작게 잡으면 잘렸다. 100vw/100vh로 두면 소스 크기가 곧
       캔버스 크기가 되고, 안의 카드는 %/vw/vh 단위로 배치돼 있어(아래) 어떤
       크기든 비율만 맞으면 자연스럽게 맞춰진다. */
    body {
      color: var(--text-main);
      font-family: var(--overlay-font);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .overlay-container {
      position: absolute;
      display: flex;
      align-items: center;
      /* 그라디언트를 쓰면 --overlay-card-bg가 그것을, 아니면 단색을 준다 */
      background: var(--overlay-card-bg, var(--glass-bg));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      padding: 16px 24px;
      border-radius: var(--overlay-rounding);
      box-shadow: var(--overlay-card-shadow, 0 15px 50px rgba(0, 0, 0, 0.6));

      /* Hard cap overlay width regardless of content length */
      width: min(400px, calc(100vw - 32px));
      max-width: min(400px, calc(100vw - 32px));
      min-width: 0;

      transition:
        transform 0.62s cubic-bezier(0.18, 1.32, 0.38, 1),
        opacity 0.32s ease;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* 플로팅 — 텍스트 영역(.info)만 위아래로 살짝 떠다닌다. 썸네일은 그대로
           유지되어 시각적 중심을 해치지 않는다. */
        .fx-wrapper {
          display: flex;
          align-items: center;
          gap: 20px;
          width: 100%;
        }

        @keyframes text-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
        }
        .overlay-container.fx-float .info {
          animation: text-float 3.2s ease-in-out infinite;
        }

        /* 글로우 — 박스 그림자 대신 텍스트에만 액센트 색 text-shadow 펄스 */
        /* 글로우는 text-shadow를 쓰는데, 그냥 두면 외곽선 설정을 통째로
           덮어써서 글로우를 켜는 순간 외곽선이 사라진다. 키프레임마다 외곽선을
           함께 실어 둘이 공존하게 한다. */
        /* 외곽선은 이제 text-stroke라 애니메이션이 건드리지 않는다.
           글로우는 그림자만 다루면 된다. */
        @keyframes text-glow-pulse {
          0%, 100% { text-shadow: var(--overlay-text-shadow, 0 0 0 transparent); }
          50% {
            text-shadow:
              0 0 24px rgb(var(--accent-rgb) / 0.7),
              0 0 48px rgb(var(--accent-rgb) / 0.3);
          }
        }
        .overlay-container.fx-glow .label,
        .overlay-container.fx-glow #title {
          animation: text-glow-pulse 2.2s ease-in-out infinite;
        }

    /* RIGHT ALIGNED — 고정 px가 아니라 %로 둬서 소스 크기가 달라져도 캔버스
       가장자리로부터 같은 비율만큼 떨어진 위치를 유지한다. */
    .overlay-container.dir-right {
      right: 6%;
      top: 50%;
      transform-origin: right center;
      transform: translate(calc(100% + var(--enter-gap-x)), -50%) scale(0.93);
    }
    .overlay-container.dir-right.visible {
      transform: translate(0, -50%) scale(var(--overlay-scale));
      opacity: 1;
    }

    /* LEFT ALIGNED */
    .overlay-container.dir-left {
      left: 6%;
      top: 50%;
      transform-origin: left center;
      transform: translate(calc(-100% - var(--enter-gap-x)), -50%) scale(0.93);
    }
    .overlay-container.dir-left.visible {
      transform: translate(0, -50%) scale(var(--overlay-scale));
      opacity: 1;
    }

    /* TOP ALIGNED */
    .overlay-container.dir-top {
      left: 50%;
      top: 50%;
      transform-origin: center top;
      transform: translate(-50%, calc(-100% - var(--enter-gap-y))) scale(0.93);
    }
    .overlay-container.dir-top.visible {
      transform: translate(-50%, -50%) scale(var(--overlay-scale));
      opacity: 1;
    }

    /* BOTTOM ALIGNED */
    .overlay-container.dir-bottom {
      left: 50%;
      top: 50%;
      transform-origin: center bottom;
      transform: translate(-50%, calc(100% + var(--enter-gap-y))) scale(0.93);
    }
    .overlay-container.dir-bottom.visible {
      transform: translate(-50%, -50%) scale(var(--overlay-scale));
      opacity: 1;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .thumbnail {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      object-fit: cover;
      background: var(--thumb-fallback);
    }

    .info {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    /* 글자 외곽선·그림자 — 밝은 방송 배경에서도 읽히게 한다.
       외곽선은 text-stroke(실제 곡선을 따는 획)로 그리고, paint-order로 획을
       채움 뒤에 깔아 글자 안쪽이 깎이지 않게 한다. 그림자는 별도 속성이라
       외곽선과 서로 덮어쓰지 않는다. */
    .label, #title, #artist, .key-bpm {
      -webkit-text-stroke: var(--overlay-stroke-width, 0) var(--overlay-stroke-color, #000);
      paint-order: stroke fill;
      text-shadow: var(--overlay-text-shadow, none);
    }

    .label {
      font-size: 11px;
      font-weight: 900;
      color: var(--accent-color);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    /* ── 표시 항목 끄기 (설정의 '화면에 보여줄 것') ──────────────────
       카드를 끄면 유리 배경·테두리·그림자를 걷어내 글자만 남는다. 이때
       방송 배경이 밝아도 읽히도록 글자에 그림자를 준다. */
    .overlay-container.no-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-color: transparent !important;
      box-shadow: none !important;
      padding: 8px 10px;
    }

    /* 카드를 끄면 배경이 없어 글자가 배경에 묻힌다. 외곽선을 따로 주지 않은
       사람을 위해 기본 그림자를 깔되, 외곽선 설정이 있으면 그쪽이 이겨야 하므로
       변수의 '기본값' 자리에 넣는다(변수를 덮어쓰면 설정이 무시된다). */
    .overlay-container.no-card .label,
    .overlay-container.no-card #title,
    .overlay-container.no-card #artist,
    .overlay-container.no-card .key-bpm {
      text-shadow: var(--overlay-text-shadow,
        0 2px 10px rgba(0, 0, 0, 0.85), 0 0 3px rgba(0, 0, 0, 0.9));
    }

    .overlay-container.no-label .label,
    .overlay-container.no-artist #artist {
      display: none;
    }

    /* 곡 진행바 — 카드 아래쪽에 얇게 깔린다. 기본은 꺼져 있다. */
    .progress-bar {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-bottom-left-radius: var(--overlay-rounding);
      border-bottom-right-radius: var(--overlay-rounding);
      overflow: hidden;
    }

    .progress-bar.on { display: block; }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      transition: width 0.25s linear;
    }

    /* 키·빠르기 배지 — 원곡과 다르게 부를 때만 의미가 있어 기본은 꺼져 있다 */
    .key-bpm {
      display: none;
      margin-top: 5px;
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(var(--accent-rgb), 0.2);
      color: var(--accent-color);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .key-bpm.on {
      display: block;
    }

    .scroll-window {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .scroll-text {
      display: inline-block;
      white-space: nowrap;
      width: max-content;
      padding-bottom: 6px; /* g, y 등 아래로 뻗는 글자가 짤리는 것 완벽 방지 */
      will-change: transform;
    }

    #title {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.2;
    }

    #artist {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.2;
      margin-top: 2px;
    }
  </style>
</head>
<body style="background: transparent;">
  <div class="overlay-container" id="container">
    <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="fx-wrapper" id="fx-wrapper">
      <div class="thumbnail-wrapper" id="thumb-wrap">
        <img src="" alt="" class="thumbnail" id="thumb">
      </div>
      <div class="info">
        <div class="label">NOW PLAYING</div>
        <div class="scroll-window"><div class="scroll-text" id="title">Title</div></div>
        <div class="scroll-window"><div class="scroll-text" id="artist">Artist</div></div>
        <div class="key-bpm" id="key-bpm"></div>
      </div>
    </div>
  </div>

  <script src="js/overlay/shared.js"></script>
  <script>
    const container = document.getElementById('container');
    document.documentElement.setAttribute('data-theme', 'dark');
    const { hexToRgb, connectWS } = window.OverlayShared;
    const thumbWrap = document.getElementById('thumb-wrap');
    const thumb = document.getElementById('thumb');
    const keyBpmEl = document.getElementById('key-bpm');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');

    // 재생 위치 시계 — 100ms 패킷 사이를 스스로 메운다(shared.js).
    const clock = window.OverlayShared.createPositionClock();
    let progressVisible = false;

    (function paintProgress() {
      if (progressVisible) {
        const dur = clock.getDuration();
        const pct = dur > 0 ? Math.max(0, Math.min(100, (clock.now() / dur) * 100)) : 0;
        progressFill.style.width = `${pct}%`;
      }
      requestAnimationFrame(paintProgress);
    })();
    const activeAnimations = {};

    /**
     * 키·빠르기 배지. `data`가 null이면 끈다.
     * 원곡 그대로(키 0 · 1.00배)면 알릴 내용이 없으므로 켜져 있어도 숨긴다 —
     * 화면에 늘 붙어 있는 "키 0"은 정보가 아니라 잡음이다.
     */
    function renderKeyBpm(data) {
      if (!keyBpmEl) return;
      if (!data) {
        keyBpmEl.classList.remove('on');
        return;
      }
      const key = Number(data.song_key ?? data.songKey ?? 0) || 0;
      const bpm = Number(data.bpm ?? 0) || 0;
      const parts = [];
      if (key !== 0) parts.push(`키 ${key > 0 ? '+' : ''}${key}`);
      if (bpm > 0) parts.push(`${Math.round(bpm)} BPM`);
      keyBpmEl.textContent = parts.join(' · ');
      keyBpmEl.classList.toggle('on', parts.length > 0);
    }
    const pendingMarqueeFrames = {};
    let pendingHideTimer = null;
    let lastDisplayTitle = "Ready";
    let lastDisplayArtist = "";
    let lastRenderedTitle = "";
    let lastRenderedArtist = "";
    let lastThumbVisible = true;
    const lastMeasuredWidth = { title: 0, artist: 0 };
    const DEFAULT_THUMB_URL = `${window.location.origin}/assets/images/app-icon.png`;
    let lastTrackSignature = "";
    let pendingTrackShowTimer = null;
    // 권장 OBS 브라우저 소스 크기 — 카드(최대 400px 폭, ~112px 높이) + 여백을
    // 감안한 실측 스냅 크기(예전 1760×520은 실제 카드보다 훨씬 커서 빈 공간이
    // 한참 남았다). 소스를 이보다 크거나 작게 잡아도 %/vw/vh 배치라 비율만
    // 비슷하면 자연스럽게 맞춰진다. 정보 오버레이 미리보기(iframe)도 같은
    // 크기를 써서, 앱 안 설정 화면 미리보기가 실제 OBS 출력과 일치한다.
    const PREVIEW_STAGE_WIDTH = 640;
    const PREVIEW_STAGE_HEIGHT = 200;
    const MARQUEE_BUMP = Math.round((window.innerWidth || PREVIEW_STAGE_WIDTH) * 0.08);
    const isPreviewMode = window.location.search.includes('preview=true');
    
    function applyMarquee(elId, text, attempt = 0) {
      const el = document.getElementById(elId);
      const parent = el.parentElement;
      
      // 1. 기존 애니메이션 완전 파기
      if (activeAnimations[elId]) {
        activeAnimations[elId].cancel();
        activeAnimations[elId] = null;
      }
      if (pendingMarqueeFrames[elId]) {
        cancelAnimationFrame(pendingMarqueeFrames[elId]);
        pendingMarqueeFrames[elId] = null;
      }
      
      // 2. 초기화 및 텍스트 갱신
      el.textContent = text;
      el.style.transform = 'none';
      
      // 3. 강제 동기화 (글자 크기를 정확하게 재기 위함)
      void el.offsetWidth;
      
      const textWidth = Math.ceil(el.scrollWidth || 0);
      const parentWidth = Math.floor(parent.getBoundingClientRect().width || parent.clientWidth || 0);
      const containerWidth = Math.floor(container.getBoundingClientRect().width || 0);
      const thumbWidth = (thumbWrap && thumbWrap.style.display !== 'none')
        ? Math.floor(thumbWrap.getBoundingClientRect().width || 0)
        : 0;
      const containerStyle = getComputedStyle(container);
      const gap = Math.floor(parseFloat(containerStyle.columnGap || containerStyle.gap || '0') || 0);
      const paddingLeft = Math.floor(parseFloat(containerStyle.paddingLeft || '0') || 0);
      const paddingRight = Math.floor(parseFloat(containerStyle.paddingRight || '0') || 0);
      const explicitInfoWidth = Math.max(0, containerWidth - thumbWidth - gap - paddingLeft - paddingRight);
      const windowWidth = Math.max(0, Math.min(parentWidth, explicitInfoWidth || parentWidth));
      const canMeasure = textWidth > 0 && windowWidth > 0;

      // Layout is not ready yet (e.g. right after thumbnail/layout change)
      if (!canMeasure) {
        if (attempt >= 5) {
          el.style.transform = 'none';
          return;
        }
        pendingMarqueeFrames[elId] = requestAnimationFrame(() => applyMarquee(elId, text, attempt + 1));
        return;
      }
      
      // 4. 화면 크기보다 글자가 길다면 JS 기반 애니메이션 시작
      const normalizedText = (text || "").replace(/\s+/g, " ").trim();
      const forceMarqueeByLength = elId === 'title' && normalizedText.length >= 18;
      const shouldMarquee = textWidth > (windowWidth - 8) || forceMarqueeByLength;

      if (shouldMarquee) {
        // Always start visible at x=0 to prevent intermittent "missing title" starts.
        const overflowDistance = Math.max(1, textWidth - windowWidth);
        const minTravel = forceMarqueeByLength ? 36 : 20;
        const travelDistance = overflowDistance + minTravel + MARQUEE_BUMP;
        const totalDistance = travelDistance * 2;
        const durationMs = (totalDistance / 50) * 1000; // 초당 50px 속도
        
        // CSS의 불확실성을 피하고 Web Animations API를 사용하여 강제로 애니메이션 구동
        activeAnimations[elId] = el.animate([
          { transform: 'translateX(0)' },
          { transform: `translateX(-${travelDistance}px)` }
        ], {
          duration: durationMs,
          iterations: Infinity,
          direction: 'alternate',
          easing: 'ease-in-out'
        });
      } else {
        el.style.transform = 'none';
      }
    }

    function update(data) {
      if (!data) return;
      try {
        const style = data.info_style || data.infoStyle || {};
        const playing = data.is_playing === true || data.isPlaying === true;
        const forced = data.is_force_visible === true || data.isForceVisible === true;
        const isPreview = window.location.search.includes('preview=true');
        const nextTitle = (data.title || "").trim();
        const nextArtist = (data.artist || "").trim();
        const trackSignature = `${nextTitle}__${nextArtist}__${(data.thumbnail || "").slice(0, 80)}`;
        const trackChanged = !!nextTitle && trackSignature !== lastTrackSignature;
        const displayTitle = nextTitle || lastDisplayTitle || "Ready";
        const displayArtist = nextArtist || lastDisplayArtist || "";
        const shouldShow = playing || forced || isPreview;

        // Styles
        document.documentElement.style.setProperty('--overlay-scale', style.scale || 1.0);
        document.documentElement.style.setProperty('--overlay-font', `"${style.font || 'Inter'}", 'Noto Sans KR', sans-serif`);
        document.documentElement.style.setProperty('--overlay-rounding', `${style.rounding !== undefined ? style.rounding : 20}px`);
        const accentHex = (style.color || '8b5cf6').replace('#', '');
        document.documentElement.style.setProperty('--accent-color', `#${accentHex}`);
        document.documentElement.style.setProperty('--accent-rgb', hexToRgb(accentHex));
        const textColor = `#${(style.text_color || style.textColor || 'ffffff').replace('#', '')}`;
        const textColorRgb = hexToRgb(style.text_color || style.textColor || 'ffffff');
        document.documentElement.style.setProperty('--text-main', textColor);
        document.documentElement.style.setProperty('--text-muted', `rgba(${textColorRgb}, 0.62)`);
        document.documentElement.style.setProperty('--glass-bg', `rgba(${hexToRgb(style.bg_color || style.bgColor)}, ${style.bg_opacity ?? style.bgOpacity ?? 0.85})`);

        // 특수효과 — 플로팅(fx-wrapper 이동)·글로우(컨테이너 그림자 펄스)
        container.classList.toggle('fx-float', style.effect_float === true || style.effectFloat === true);
        container.classList.toggle('fx-glow', style.effect_glow === true || style.effectGlow === true);

        // Layout / Direction
        const dir = style.animation_direction || style.animationDirection || 'right';
        
        container.classList.remove('dir-left', 'dir-right', 'dir-top', 'dir-bottom');
        container.classList.add(`dir-${dir}`);

        // 화면에 무엇을 보여줄지 — 설정에서 항목별로 끄고 켠다.
        // 필드가 없는 예전 설정은 "예전과 같은 화면"이 되도록 기본 true.
        const vis = style.visibility || {};
        const on = (v) => v !== false;
        // 디자인 축(외곽선·그림자·그라디언트)을 CSS 변수로 푼다
        window.OverlayShared.applyDesign(style);

        // 진행바 — 위치는 앱이 알려주되, 패킷 사이(100ms)는 시계가 메운다.
        // 예전에는 받은 값을 그대로 그려서 진행바가 100ms 계단으로 움직였다.
        const showProgress = on(vis.progress) && vis.progress !== undefined;
        progressBar.classList.toggle('on', showProgress === true);
        clock.update(
          data.position_ms ?? data.positionMs ?? 0,
          data.duration_ms ?? data.durationMs ?? 0,
          data.is_playing,
        );
        progressVisible = showProgress === true;

        container.classList.toggle('no-card', !on(vis.card));
        container.classList.toggle('no-label', !on(vis.label));
        container.classList.toggle('no-artist', !on(vis.artist));
        renderKeyBpm(on(vis.keyBpm ?? vis.key_bpm) ? data : null);

        // Content layout first (thumbnail affects available text width)
        const hasThumb = !!(data.thumbnail && data.thumbnail.length > 20);
        const shouldShowThumb = on(vis.cover);
        const thumbVisibilityChanged = shouldShowThumb !== lastThumbVisible;
        thumbWrap.style.display = shouldShowThumb ? 'block' : 'none';
        if (shouldShowThumb) thumb.src = hasThumb ? data.thumbnail : DEFAULT_THUMB_URL;
        lastThumbVisible = shouldShowThumb;

        const titleChanged = displayTitle !== lastRenderedTitle;
        const artistChanged = displayArtist !== lastRenderedArtist;
        const titleParentWidth = Math.floor(document.getElementById('title').parentElement.getBoundingClientRect().width || 0);
        const artistParentWidth = Math.floor(document.getElementById('artist').parentElement.getBoundingClientRect().width || 0);
        const widthChanged =
          Math.abs(titleParentWidth - (lastMeasuredWidth.title || 0)) > 1 ||
          Math.abs(artistParentWidth - (lastMeasuredWidth.artist || 0)) > 1;
        const shouldReflowMarquee = titleChanged || artistChanged || thumbVisibilityChanged || widthChanged;

        // Apply marquee only when text/layout changed to avoid constant animation resets.
        if (shouldReflowMarquee) {
          requestAnimationFrame(() => {
            applyMarquee('title', displayTitle);
            applyMarquee('artist', displayArtist);
          });
          lastRenderedTitle = displayTitle;
          lastRenderedArtist = displayArtist;
          lastMeasuredWidth.title = titleParentWidth;
          lastMeasuredWidth.artist = artistParentWidth;
        }

        // Keep last non-empty metadata to avoid intermittent empty packets clearing text.
        if (nextTitle) lastDisplayTitle = nextTitle;
        if (nextArtist) lastDisplayArtist = nextArtist;

        if (shouldShow) {
          if (pendingHideTimer) {
            clearTimeout(pendingHideTimer);
            pendingHideTimer = null;
          }
          if (trackChanged && container.classList.contains('visible')) {
            if (pendingTrackShowTimer) {
              clearTimeout(pendingTrackShowTimer);
              pendingTrackShowTimer = null;
            }
            container.classList.remove('visible');
            pendingTrackShowTimer = setTimeout(() => {
              container.classList.add('visible');
              pendingTrackShowTimer = null;
            }, 170);
          } else {
            container.classList.add('visible');
          }
        } else {
          // Avoid flicker when backend briefly reports non-playing during transitions.
          if (!pendingHideTimer) {
            pendingHideTimer = setTimeout(() => {
              container.classList.remove('visible');
              pendingHideTimer = null;
            }, 220);
          }
        }
        if (nextTitle) {
          lastTrackSignature = trackSignature;
        }
      } catch (e) { console.error(e); }
    }

    if (isPreviewMode) {
      document.body.style.width = `${PREVIEW_STAGE_WIDTH}px`;
      document.body.style.height = `${PREVIEW_STAGE_HEIGHT}px`;
      update({
        info_style: {},
        is_playing: true,
        is_force_visible: true,
        title: '지금 재생 중인 곡',
        artist: '아티스트 · OSW 미리보기',
      });
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const style = window.OverlayShared.previewStyleFromMessage(event.data, 'info');
        if (!style) return;
        update({
          info_style: style,
          is_playing: true,
          is_force_visible: true,
          title: lastDisplayTitle || '지금 재생 중인 곡',
          artist: lastDisplayArtist || '아티스트 · OSW 미리보기',
        });
      });
    }
    // 개발용 — ?dev=1 이면 WS 대신 창 밖에서 상태를 밀어 넣을 수 있게 연다.
    // 백엔드(Tauri/WS) 없이 프런트만으로 렌더링을 확인하기 위한 통로다.
    if (isPreviewMode) {
      // 미리보기는 부모 설정창의 postMessage만 받는다.
    } else if (new URLSearchParams(location.search).get('dev') === '1') {
      window.__applyOverlayState = update;
    } else {
      connectWS(update, undefined, () => {
        // 앱 종료/서버 중단 시 마지막 곡 정보가 OBS에 고정되지 않게 즉시 숨긴다.
        if (pendingHideTimer) {
          clearTimeout(pendingHideTimer);
          pendingHideTimer = null;
        }
        if (pendingTrackShowTimer) {
          clearTimeout(pendingTrackShowTimer);
          pendingTrackShowTimer = null;
        }
        container.classList.remove('visible');
      });
    }
    thumb.onerror = () => {
      if (thumb.src !== DEFAULT_THUMB_URL) {
        thumb.src = DEFAULT_THUMB_URL;
      }
    };
    thumbWrap.style.display = 'block';
    if (!thumb.src) {
      thumb.src = DEFAULT_THUMB_URL;
    }

  </script>
</body>
</html>
