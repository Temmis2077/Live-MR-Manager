<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSW Lyrics Overlay</title>
    <!-- @import는 로드가 끝날 때까지 첫 페인트를 막아, 느린 네트워크에서 이
         투명 오버레이가 잠깐 흰 배경으로 보이는 원인이 된다(가끔 발생하는 흰
         배경 버그). media="print" 트릭으로 렌더링을 막지 않게 비동기 로드한다.
         color-scheme: dark only는 브라우저가 기본 스타일시트를 어둡게 적용해
         페이지 로드 직전의 흰색 깜빡임도 방지한다. -->
    <meta name="color-scheme" content="dark only">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&family=SUITE:wght@400;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
        rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --accent-color: #8b5cf6;
      --accent-rgb: 139 92 246;
      --overlay-scale: 1;
      --overlay-font: 'Inter', 'Noto Sans KR', sans-serif;
      --overlay-rounding: 20px;
      --glass-bg: rgba(15, 15, 20, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.5);
      --text-shadow: rgba(0, 0, 0, 0.3);
      /* 등장 애니메이션 이동 거리 — 뷰포트(=OBS 소스 크기) 비례. */
      --enter-gap-x: 10vw;
      --enter-gap-y: 20vh;
      /* 가사 폰트 크기 — 설정에서 조정 가능(update_overlay_style font_size).
         줄 높이는 폰트 크기에 비례해 따라가므로 크기를 키워도 잘리지 않음. */
      --lyric-font-size: 22px;
      /* 원문/차음(+번역) 3줄 모드는 <br>로 2~3줄이 들어올 수 있어 여유를 둠.
         (전체 오버레이 레이아웃 리디자인은 하지 않고 높이만 늘림) */
      --lyric-current-height: calc(var(--lyric-font-size) * 2.27);
      --lyric-next-height: calc(var(--lyric-font-size) * 1.82);
      --lyric-lines-gap: 4px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
          background: transparent !important;
          color-scheme: dark;
        }

    /* OBS 브라우저 소스에 설정된 크기를 그대로 채운다(카드는 아래에서 %/vw/vh
       단위로 배치돼 있어, 소스를 어떤 크기로 잡아도 비율만 비슷하면 맞춰진다).
       독립/미리보기 창에서 보는 고정 크기는 스크립트에서 별도로 지정한다. */
    body {
      color: var(--text-main);
      font-family: var(--overlay-font);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .overlay-container {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--overlay-card-bg, var(--glass-bg));
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 18px 28px;
      border-radius: var(--overlay-rounding);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      
      min-width: 400px;
      max-width: 90vw;
      /* 카드 최소 높이도 글자 크기를 따라간다 — 고정 96px이면 큰 글자에서 넘친다 */
      min-height: max(96px, calc(var(--lyric-font-size) * 4.4));
      text-align: center;

      transition: opacity 0.35s ease, border-radius 0.3s ease, background 0.3s ease;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* RIGHT ALIGNED (comes from right) */
    .overlay-container.dir-right { transform: translate(calc(100% + var(--enter-gap-x)), -50%) scale(0.97); }
    .overlay-container.dir-right.visible {
      transform: translate(-50%, -50%) scale(var(--overlay-scale));
      opacity: 1;
      animation: lyrics-pop-right var(--anim-duration, 0.55s) cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    /* LEFT ALIGNED (comes from left) */
    .overlay-container.dir-left { transform: translate(calc(-100% - var(--enter-gap-x)), -50%) scale(0.97); }
    .overlay-container.dir-left.visible {
      transform: translate(-50%, -50%) scale(var(--overlay-scale));
      opacity: 1;
      animation: lyrics-pop-left var(--anim-duration, 0.55s) cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    /* TOP ALIGNED (comes from top) */
    .overlay-container.dir-top { transform: translate(-50%, calc(-100% - var(--enter-gap-y))) scale(0.97); }
    .overlay-container.dir-top.visible {
      transform: translate(-50%, -50%) scale(var(--overlay-scale));
      opacity: 1;
      animation: lyrics-pop-top var(--anim-duration, 0.55s) cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    /* BOTTOM ALIGNED (comes from bottom) */
    .overlay-container.dir-bottom { transform: translate(-50%, calc(100% + var(--enter-gap-y))) scale(0.97); }
    .overlay-container.dir-bottom.visible {
      transform: translate(-50%, -50%) scale(var(--overlay-scale));
      opacity: 1;
      animation: lyrics-pop-bottom var(--anim-duration, 0.55s) cubic-bezier(0.2, 0.9, 0.3, 1) both;
          }

          /* 플로팅 효과 — 현재 가사 줄(.lyric-line.current)만 살짝 떠다닌다.
             다음 줄은 그대로 유지. */
          @keyframes text-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
          }
          .overlay-container.fx-float .lyric-line.current {
            animation: text-float 3.2s ease-in-out infinite;
          }

          /* 글로우 효과 — 박스 그림자 대신 현재 가사 줄에만 text-shadow 펄스.
             방향별 등장 애니메이션과 충돌하지 않도록 별도 요소에 적용한다. */
          /* 외곽선을 함께 실어 글로우와 공존시킨다(아래 info 쪽과 같은 이유). */
          /* 외곽선은 text-stroke라 애니메이션과 무관하다. */
          @keyframes text-glow-pulse {
            0%, 100% { text-shadow: var(--overlay-text-shadow, 0 2px 4px var(--text-shadow)); }
            50% {
              text-shadow:
                0 0 24px rgb(var(--accent-rgb) / 0.7),
                0 0 48px rgb(var(--accent-rgb) / 0.3);
            }
          }
          .overlay-container.fx-glow .lyric-line.current {
            animation: text-glow-pulse 2.2s ease-in-out infinite;
          }

    .lyrics-container {
      display: none;
      flex-direction: column;
      gap: var(--lyric-lines-gap);
      width: 100%;
      animation: fadeIn 0.5s ease-out forwards;
      align-items: center;
      /* 높이를 고정하지 않는다. 3줄 모드(원문/차음/번역)나 큰 글자에서는
         내용이 두 줄 높이를 넘는데, 고정하면 그만큼 잘려 나갔다.
         최소 높이만 잡아 짧은 가사에서도 카드가 덜컹이지 않게 한다. */
      min-height: calc(var(--lyric-current-height) + var(--lyric-next-height) + var(--lyric-lines-gap));
      position: relative;
    }
    
    .lyrics-container.active { display: flex; }

    .lyric-line {
      font-weight: 500;
      white-space: normal;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: none;
    }

    .lyric-line.current {
      color: var(--text-main);
      font-size: var(--lyric-font-size);
      line-height: 1.35;
      font-weight: 700;
      text-shadow: 0 2px 4px var(--text-shadow);
      min-height: var(--lyric-current-height);
    }

    /* ── 표시 항목 끄기 (설정의 '화면에 보여줄 것') ──────────────────
       카드를 끄면 배경 없이 가사 글자만 나간다. 방송 배경이 밝아도 읽히도록
       글자 그림자를 준다. */
    .overlay-container.no-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    /* 카드를 끄면 기본 그림자를 깔되, 외곽선 설정이 있으면 그쪽이 이긴다
       (변수를 덮어쓰지 않고 기본값 자리에 둔다). */
    .overlay-container.no-card .lyric-line {
      text-shadow: var(--overlay-text-shadow,
        0 2px 12px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.9));
    }

    /* 다음 줄을 끄면 자리까지 없애 카드가 그만큼 낮아진다
       (높이만 0으로 두면 빈 줄이 남아 어색하다) */
    .overlay-container.no-next .lyric-line.next {
      display: none;
    }

    /* 글자 외곽선·그림자 — 밝은 방송 배경에서도 가사가 읽히게.
       .lyric-line.current 가 자기 text-shadow를 갖고 있어 그보다 구체적으로
       적어야 외곽선이 현재 줄에도 걸린다(외곽선이 정작 필요한 줄이다). */
    .lyric-line,
    .overlay-container .lyric-line.current,
    .overlay-container .lyric-line.next {
      -webkit-text-stroke: var(--overlay-stroke-width, 0) var(--overlay-stroke-color, #000);
      paint-order: stroke fill;
      text-shadow: var(--overlay-text-shadow, none);
    }

    .lyric-line.next {
      color: var(--text-sub);
      font-size: calc(var(--lyric-font-size) * 0.73);
      margin-top: 4px;
      line-height: 1.35;
      min-height: var(--lyric-next-height);
    }

    /* 3줄(원문/차음/번역) 모드에서 2줄 이상이 한 슬롯에 들어갈 때 —
       한 줄 기준 폰트 크기를 그대로 쓰면 카드가 지나치게 커질 수 있어
       줄 수에 맞춰 기준 폰트를 조금 줄이고 줄간격도 좁힌다.
       (하위 줄은 lyric-drawer.js의 displayText()가 0.7em 인라인 스타일로
       이미 상대적으로 더 작게 렌더링하므로, 여기서는 컨테이너 기준값만 조정) */
    .lyric-line.current.multi-line {
      font-size: calc(var(--lyric-font-size) * 0.77);
      line-height: 1.22;
    }
    .lyric-line.next.multi-line {
      font-size: calc(var(--lyric-font-size) * 0.59);
      line-height: 1.22;
    }

    .lyrics-container.line-promoting #lyric-current {
      transform: translateY(-14px);
      opacity: 0.72;
      color: var(--text-sub);
      font-size: calc(var(--lyric-font-size) * 0.73);
      font-weight: 500;
      transition-delay: 0ms;
    }
    .lyrics-container.line-promoting #lyric-next {
      transform: translateY(calc(-1 * (var(--lyric-next-height) + var(--lyric-lines-gap))));
      opacity: 1;
      color: var(--text-main);
      font-size: var(--lyric-font-size);
      font-weight: 700;
      transition-delay: 0ms;
    }

    .lyrics-container.promote-setup #lyric-current {
      transform: translateY(0);
      opacity: 1;
    }
    .lyrics-container.promote-setup #lyric-next {
      transform: translateY(0);
      opacity: 1;
    }

    /* 줄 안 진행도(가라오케 와이프).
       글자 위에 같은 글자를 강조색으로 겹쳐 놓고 왼쪽부터 드러낸다.
       background-clip 대신 겹치기를 쓰는 이유는, 외곽선(text-stroke)·그림자·
       그라디언트 같은 기존 디자인 축과 싸우지 않기 위해서다. */
    .lyric-line.current { position: relative; }

    .lyric-base { display: inline-block; max-width: 100%; }
    .overlay-lyric-display-line { display: inline-block; max-width: 100%; }
    .overlay-lyric-display-line[data-progress-target="true"] {
      position: relative;
      display: inline-grid;
    }
    .overlay-lyric-display-line[data-progress-target="true"] > .overlay-lyric-line-text,
    .overlay-lyric-display-line[data-progress-target="true"] > .lyric-wipe {
      grid-area: 1 / 1;
      min-width: 0;
      white-space: normal;
      overflow-wrap: inherit;
      text-align: inherit;
    }
    .overlay-lyric-sub { font-size: 0.7em; opacity: 0.85; }

    .lyric-wipe {
      pointer-events: none;
      color: var(--accent-color, #8b5cf6);
      overflow: hidden;
      clip-path: inset(0 calc((1 - var(--lyric-wipe, 0)) * 100%) 0 0);
    }

    .overlay-container.no-wipe .lyric-wipe { display: none; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 줄 전환 — 글자만 짧게 번진다. 카드 등장(lyrics-pop-*)과 분리해서,
       줄이 바뀔 때 표시가 등장 애니메이션을 기다리지 않게 한다. */
    @keyframes lyric-line-swap {
      0%   { opacity: 0.35; transform: translateY(3px); }
      100% { opacity: 1;    transform: translateY(0); }
    }
    .lyric-line.line-swap {
      animation: lyric-line-swap 0.14s ease-out both;
    }

    /* 움직임을 줄여 달라고 한 사용자에게는 전부 즉시 바꾼다. */
    @media (prefers-reduced-motion: reduce) {
      .overlay-container.visible,
      .lyric-line.line-swap {
        animation-duration: 0.01ms !important;
      }
    }

    @keyframes lyrics-pop-right {
      0% { transform: translate(calc(100% + var(--enter-gap-x)), -50%) scale(0.97); }
      100% { transform: translate(-50%, -50%) scale(var(--overlay-scale)); }
    }
    @keyframes lyrics-pop-left {
      0% { transform: translate(calc(-100% - var(--enter-gap-x)), -50%) scale(0.97); }
      100% { transform: translate(-50%, -50%) scale(var(--overlay-scale)); }
    }
    @keyframes lyrics-pop-top {
      0% { transform: translate(-50%, calc(-100% - var(--enter-gap-y))) scale(0.97); }
      100% { transform: translate(-50%, -50%) scale(var(--overlay-scale)); }
    }
    @keyframes lyrics-pop-bottom {
      0% { transform: translate(-50%, calc(100% + var(--enter-gap-y))) scale(0.97); }
      100% { transform: translate(-50%, -50%) scale(var(--overlay-scale)); }
    }

  </style>
</head>
<body style="background: transparent;">
  <div class="overlay-container" id="overlay">
    <div class="fx-wrapper" id="fx-wrapper">
      <div class="lyrics-container" id="lyrics-area">
        <div class="lyric-line current" id="lyric-current">&nbsp;</div>
        <div class="lyric-line next" id="lyric-next">&nbsp;</div>
      </div>
    </div>
  </div>

  <script src="js/overlay/shared.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isPreview = urlParams.get('preview') === 'true';
    document.documentElement.setAttribute('data-theme', 'dark');

    // 권장 OBS 브라우저 소스 크기 — 카드(최소 400px 폭, ~130px 높이) + 여백을
    // 감안한 실측 스냅 크기(예전 1200×300은 실제 카드보다 훨씬 커서 빈 공간이
    // 한참 남았다). 독립 탭/앱 내 설정 미리보기에서 볼 때만 이 고정 크기로
    // 맞추고, 실제 OBS 소스에서는 위 body{width:100vw;height:100vh}가 소스에
    // 설정된 크기를 그대로 따른다(비율만 비슷하면 자연스럽게 맞춰짐).
    const PREVIEW_STAGE_WIDTH = 640;
    const PREVIEW_STAGE_HEIGHT = 220;
    if (isPreview) {
      document.body.style.width = `${PREVIEW_STAGE_WIDTH}px`;
      document.body.style.height = `${PREVIEW_STAGE_HEIGHT}px`;
      // 미리보기에는 예시 문구를 미리 넣어 둔다. 비어 있으면 글자 크기·색·
      // 그림자를 눈으로 확인할 수 없어 설정을 맞출 수가 없다. 실제 데이터가
      // 오면 그때 덮어쓰이므로 방송에는 영향이 없다.
      document.getElementById('lyric-current').textContent = '지금 부르는 줄이 이렇게 보입니다';
      document.getElementById('lyric-next').textContent = '다음 줄은 이렇게 흐리게 따라옵니다';
      document.getElementById('overlay').classList.add('visible');
    }

    const { hexToRgb, connectWS } = window.OverlayShared;

    const overlay = document.getElementById('overlay');
    const lyricsArea = document.getElementById('lyrics-area');
    const lyricCurrent = document.getElementById('lyric-current');
    const lyricNext = document.getElementById('lyric-next');
    let displayedCurrent = "";
    let displayedNext = "";
    let lineAnimTimer = null;
    let lastTrackSignature = "";
    let pendingTrackShowTimer = null;

    function setLineTexts(currentText, nextText) {
      currentText = currentText || "";
      nextText = nextText || "";
      if (currentText === displayedCurrent && nextText === displayedNext
          && lyricCurrent.querySelector('.lyric-base')) return false;
      // .lyric-line is `display:flex`; a bare text-node + <br> + <span> as
      // *direct* flex children each become their own flex item and lay out
      // side-by-side in a row — the <br> has no effect at all. Wrapping the
      // whole payload in one element makes it a single flex item, so its
      // *internal* content (including <br>) uses normal inline flow instead.
      // 와이프용 겹침 요소를 같이 넣는다 — 같은 글자를 강조색으로 위에 얹고
      // 진행도만큼만 드러낸다. 원본 마크업을 그대로 복제해야 줄바꿈·크기가
      // 어긋나지 않는다.
      // Preview and older senders may still provide a plain HTML string. Treat
      // that single line as the normal progress target; current app payloads
      // already carry explicit role/target markup.
      const normalizedCurrent = currentText && !/data-lyric-role=/i.test(currentText)
        ? `<span class="overlay-lyric-display-line" data-lyric-role="text" data-progress-target="true"><span class="overlay-lyric-line-text">${currentText}</span></span>`
        : currentText;
      const body = normalizedCurrent && normalizedCurrent.trim() ? `<span class="lyric-base">${normalizedCurrent}</span>` : '&nbsp;';
      lyricCurrent.innerHTML = body;
      const progressTarget = lyricCurrent.querySelector('[data-progress-target="true"]');
      if (progressTarget) {
        const source = progressTarget.querySelector('.overlay-lyric-line-text');
        const wipe = document.createElement('span');
        wipe.className = 'lyric-wipe';
        wipe.setAttribute('aria-hidden', 'true');
        wipe.innerHTML = source?.innerHTML || '';
        progressTarget.appendChild(wipe);
      }
      lyricNext.innerHTML = nextText && nextText.trim() ? `<span>${nextText}</span>` : '&nbsp;';
      // 3줄 모드에서 2줄 이상 보여지는 슬롯은 폰트를 줄여 고정 높이 박스 안에서
      // 잘리거나 겹치지 않게 한다(<br>로 조인되므로 그 존재 여부로 판단).
      lyricCurrent.classList.toggle('multi-line', /<br\s*\/?>/i.test(currentText || ''));
      lyricNext.classList.toggle('multi-line', /<br\s*\/?>/i.test(nextText || ''));

      // 줄이 바뀔 때는 글자만 아주 짧게 번지듯 바꾼다(140ms). 내용은 이미
      // 새 것으로 들어가 있으므로 표시가 애니메이션을 기다리지 않는다 —
      // 카드 등장 애니메이션과 줄 전환을 분리하는 게 핵심이다.
      if (currentText !== displayedCurrent) {
        lyricCurrent.classList.remove('line-swap');
        void lyricCurrent.offsetWidth; // 재시작을 위해 리플로우 강제
        lyricCurrent.classList.add('line-swap');
      }

      displayedCurrent = currentText || "";
      displayedNext = nextText || "";
      return true;
    }

    function animateLinePromotion(newCurrent, newNext) {
      if (lineAnimTimer) {
        clearTimeout(lineAnimTimer);
        lineAnimTimer = null;
      }
      lyricsArea.classList.remove('line-promoting');
      lyricsArea.classList.remove('promote-setup');
      setLineTexts(newCurrent, newNext);
    }

    /** 오버레이 스타일(CSS 변수) 적용 — 표시 여부와 무관하게 호출된다. */
    function applyStyle(style) {
      const scale = style.scale || 1.0;
      const font = style.font || 'Inter';
      const color = (style.color || 'ffffff').replace('#', '');
      const textColorHex = (style.text_color || style.textColor || 'ffffff').replace('#', '');
      const bgColor = (style.bg_color || "0f0f14").replace('#', '');
      const bgOpacity = style.bg_opacity !== undefined ? style.bg_opacity : 0.6;
      const rounding = style.rounding !== undefined ? style.rounding : 20;
      const direction = style.animation_direction || 'right';

      document.documentElement.style.setProperty('--overlay-scale', scale);
      // 가사 폰트 크기 — 0/미지정이면 기본 22px. 줄 높이는 CSS calc로 비례.
      const fontSize = Number(style.font_size ?? style.fontSize) || 0;
      document.documentElement.style.setProperty('--lyric-font-size', `${fontSize > 0 ? fontSize : 22}px`);
      document.documentElement.style.setProperty('--overlay-font', `"${font}", 'Noto Sans KR', sans-serif`);
      document.documentElement.style.setProperty('--glass-bg', `rgba(${hexToRgb(bgColor)}, ${bgOpacity})`);
      document.documentElement.style.setProperty('--overlay-rounding', `${rounding}px`);
      document.documentElement.style.setProperty('--accent-color', `#${color}`);
      document.documentElement.style.setProperty('--accent-rgb', hexToRgb(color));
      document.documentElement.style.setProperty('--text-main', `#${textColorHex}`);
      document.documentElement.style.setProperty('--text-sub', `rgba(${hexToRgb(textColorHex)}, 0.58)`);
      // 특수효과 — 플로팅(fx-wrapper 이동)·글로우(컨테이너 그림자 펄스)
      overlay.classList.toggle('fx-float', style.effect_float === true || style.effectFloat === true);
      overlay.classList.toggle('fx-glow', style.effect_glow === true || style.effectGlow === true);

      // 화면에 무엇을 보여줄지. 필드가 없는 예전 설정은 예전과 같은 화면이 되게
      // 기본 true로 본다.
      // 디자인 축(외곽선·그림자·그라디언트)
      window.OverlayShared.applyDesign(style);

      const vis = style.visibility || {};
      const on = (v) => v !== false;
      overlay.classList.toggle('no-card', !on(vis.card));
      overlay.classList.toggle('no-next', !on(vis.nextLine ?? vis.next_line));

      // 카드 등장 애니메이션 길이.
      //
      // 예전에는 좌/우 1.5초, 상/하 0.7초였다. 이 애니메이션은 카드 전체를
      // 움직이므로 그동안 가사 글자도 같이 화면 밖에 있다 — 곡의 첫 줄과 곡
      // 전환에서 "가사 블럭엔 이미 들어갔는데 화면엔 한참 뒤에 뜬다"의 실제
      // 원인이었다. 등장인 걸 알아볼 만큼만 남기고 짧게 줄인다.
      // 좌/우는 이동 거리가 길어 조금 더 준다.
      const isHorizontal = direction === 'right' || direction === 'left';
      document.documentElement.style.setProperty('--anim-duration', isHorizontal ? '0.34s' : '0.26s');
    }

    // 재생 위치 시계 — 100ms 패킷 사이를 스스로 메운다(shared.js).
    const clock = window.OverlayShared.createPositionClock();
    let lineStartMs = 0;
    let lineEndMs = 0;
    let lineWords = [];

    // 진행도 계산의 정본은 shared.js에 있다 — 앱 쪽 구현과 어긋나면
    // 앱 화면과 방송 화면의 진행도가 달라진다.
    const wipeRatio = (posMs) =>
      window.OverlayShared.lineWipeRatio(lineWords, lineStartMs, lineEndMs, posMs);

    (function paintWipe() {
      const el = lyricCurrent;
      if (el && (isPreview || lineEndMs > lineStartMs)) {
        // 미리보기는 실제 재생 상태를 바꾸지 않고 자체 예시 진행을 반복한다.
        const cycleMs = 4500;
        const ratio = isPreview
          ? Math.min(1, (performance.now() % cycleMs) / 4000)
          : wipeRatio(clock.now());
        el.style.setProperty('--lyric-wipe', ratio.toFixed(4));
      } else if (el) {
        el.style.setProperty('--lyric-wipe', '0');
      }
      requestAnimationFrame(paintWipe);
    })();

    function updateOverlay(data) {
      if (!data) return;

      clock.update(
        data.position_ms ?? data.positionMs ?? 0,
        data.duration_ms ?? data.durationMs ?? 0,
        data.is_playing,
      );
      lineStartMs = Number(data.line_start_ms ?? data.lineStartMs ?? 0) || 0;
      lineEndMs = Number(data.line_end_ms ?? data.lineEndMs ?? 0) || 0;
      lineWords = Array.isArray(data.line_words ?? data.lineWords)
        ? (data.line_words ?? data.lineWords)
        : [];

      // 스타일은 표시 여부와 무관하게 항상 먼저 반영한다 — 예전에는 재생
      // 중이 아닐 때 아래 early-return이 스타일 적용을 건너뛰어, 설정에서
      // 바꾼 폰트 크기 등이 미리보기(iframe, isPreview)에만 보이고 OBS
      // 쪽에는 다음 재생 전까지 반영되지 않는 버그가 있었음.
      applyStyle(data.lyrics_style || {});

      // 일시정지는 강제 표시 설정과 관계없이 방송 가사를 숨긴다. 강제 표시는
      // 설정 미리보기용이지, 멈춘 가사를 방송 화면에 고정하는 옵션이 아니다.
      if (!data.is_playing && !isPreview) {
        if (pendingTrackShowTimer) {
          clearTimeout(pendingTrackShowTimer);
          pendingTrackShowTimer = null;
        }
        lyricsArea.classList.remove('active');
        hideOverlay();
        return;
      }

      const direction = (data.lyrics_style || {}).animation_direction || 'right';

      const hasCurrent = data.current_lyric && data.current_lyric.trim() !== "";
      const hasNext = data.next_lyric && data.next_lyric.trim() !== "";
      const nextTitle = (data.title || "").trim();
      const nextArtist = (data.artist || "").trim();
      const trackSignature = `${nextTitle}__${nextArtist}__${(data.thumbnail || "").slice(0, 80)}`;
      const trackChanged = !!nextTitle && trackSignature !== lastTrackSignature;

      const shouldShow = hasCurrent || hasNext || data.is_force_visible || isPreview;

      const applyShow = () => {
        const directionClass = `dir-${direction}`;
        // 진행 패킷마다 방향 클래스를 떼었다 붙이면 .visible.dir-*의 등장
        // 애니메이션이 계속 재시작되어 카드와 강조색이 빠르게 깜빡인다.
        if (!overlay.classList.contains(directionClass)) {
          overlay.classList.remove('dir-left', 'dir-right', 'dir-top', 'dir-bottom');
          overlay.classList.add(directionClass);
        }
        overlay.dataset.currentDirection = direction;
        
        if (shouldShow) {
          lyricsArea.classList.add('active');
          const newCurrent = hasCurrent ? data.current_lyric : "";
          const newNext = hasNext ? data.next_lyric : "";
          const textChanged = newCurrent !== displayedCurrent || newNext !== displayedNext;
          const shouldPromote = textChanged && displayedNext && newCurrent && displayedNext === newCurrent;
          if (shouldPromote) {
            animateLinePromotion(newCurrent, newNext);
          } else if (textChanged) {
            setLineTexts(newCurrent, newNext);
          }
          if (trackChanged && overlay.classList.contains('visible')) {
            if (pendingTrackShowTimer) {
              clearTimeout(pendingTrackShowTimer);
              pendingTrackShowTimer = null;
            }
            hideOverlay();
            pendingTrackShowTimer = setTimeout(() => {
              showOverlay();
              pendingTrackShowTimer = null;
            }, 170);
          } else {
            showOverlay();
          }
        } else {
          lyricsArea.classList.remove('active');
          hideOverlay();
        }
      };

      const oldDirection = overlay.dataset.currentDirection;
      if (oldDirection && oldDirection !== direction && overlay.classList.contains('visible')) {
        hideOverlay();
        setTimeout(applyShow, 300);
      } else {
        applyShow();
      }
      if (nextTitle) {
        lastTrackSignature = trackSignature;
      }
    }

    function showOverlay() { overlay.classList.add('visible'); }
    function hideOverlay() { overlay.classList.remove('visible'); }

    if (isPreview) {
      applyStyle({});
      setLineTexts('지금 부르는 줄이 이렇게 보입니다', '다음 줄은 이렇게 흐리게 따라옵니다');
      lyricsArea.classList.add('active');
      showOverlay();
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const style = window.OverlayShared.previewStyleFromMessage(event.data, 'lyrics');
        if (style) applyStyle(style);
      });
    }

    // 개발용 — ?dev=1 이면 WS 대신 외부 주입을 받는다(백엔드 없이 확인).
    if (isPreview) {
      // 설정창 미리보기는 전용 예시 데이터만 사용한다. 실제 송출 상태를
      // 구독하면 재생 패킷이 예시 문구와 자동 진행도를 덮어쓰게 된다.
    } else if (new URLSearchParams(location.search).get('dev') === '1') {
      window.__applyOverlayState = updateOverlay;
    } else {
      connectWS(updateOverlay, undefined, () => {
        // 앱이 종료되면 WebSocket이 닫힌다. 마지막 상태를 유지하면 OBS에는
        // 앱이 없는 동안에도 가사가 영구적으로 남으므로 연결 종료 즉시 숨긴다.
        if (pendingTrackShowTimer) {
          clearTimeout(pendingTrackShowTimer);
          pendingTrackShowTimer = null;
        }
        lyricsArea.classList.remove('active');
        hideOverlay();
      });
    }
  </script>
</body>
</html>
