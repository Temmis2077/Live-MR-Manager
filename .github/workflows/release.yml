name: "release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundleArgs: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Client ID만 바이너리에 임베드. Secret은 Vercel Companion env에만 둠.
          MELOMING_CLIENT_ID: ${{ secrets.MELOMING_CLIENT_ID }}
          MELOMING_USE_COMPANION_EXCHANGE: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OSW ${{ github.ref_name }} — Open Stem Wave"
          releaseBody: |
            🌊 OSW(Open Stem Wave) ${{ github.ref_name }}

            곡을 스템(보컬·MR)으로 열어 노래하고, 가사를 AI로 싱크하고, OBS로 방송에 얹는
            개방형 스템 분리 미니 DAW입니다.

            **Windows용 NSIS 설치 파일**을 다운로드하세요. 처음 실행하면 이전 버전
            (Live MR Manager) 데이터를 가져올지 물어봅니다.

            상세 변경 사항: [RELEASE_NOTES.md](https://github.com/Temmis2077/Live-MR-Manager-Mod/blob/main/RELEASE_NOTES.md)
          releaseDraft: true
          prerelease: true
          args: "--verbose ${{ matrix.bundleArgs }}"
